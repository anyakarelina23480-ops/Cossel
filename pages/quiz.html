<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cossel | Анкетирование</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav>
        <a href="../index.html"><i class="fa-solid fa-house"></i> Главная</a>
        <a href="catalog.html"><i class="fa-solid fa-list-ul"></i> Каталог</a>
        <a href="favorites.html"><i class="fa-regular fa-bookmark"></i>  Избранное</a>
      </nav>
    </header>
    <main>
      <form id="quizForm">
        <div class="quiz-step" data-step="1">
          <h2>Шаг 1 из 3</h2>
          <label for="quizCategory">Тип продукта:</label>
          <select id="quizCategory" required>
            <option value="" selected disabled hidden>Выберите продукт</option>
            <optgroup label="Глаза">
              <option value="Тушь">Тушь</option>
              <option value="Тени для век">Тени для век</option>
              <option value="Подводка">Подводка</option>
              <option value="Карандаш для глаз">Карандаш для глаз</option>
            </optgroup>

            <optgroup label="Лицо">
              <option value="Тональный крем">Тональный крем</option>
              <option value="Пудра">Пудра</option>
              <option value="Консилер">Консилер</option>
              <option value="Румяна">Румяна</option>
              <option value="Хайлайтер">Хайлайтер</option>
              <option value="Праймер">Праймер</option>
              <option value="Бронзер">Бронзер</option>
            </optgroup>

            <optgroup label="Губы">
              <option value="Помада">Помада</option>
              <option value="Блеск для губ">Блеск для губ</option>
              <option value="Карандаш для губ">Карандаш для губ</option>
              <option value="Тинт">Тинт</option>
            </optgroup>
          </select>
          <button type="button" class="button-next">Далее</button>
        </div>

        <div class="quiz-step" data-step="2" style="display: none">
          <h2>Шаг 2 из 3</h2>
          <fieldset id="featureQuestion">
            <legend id="featureLabel">Особенности</legend>

            <!-- JS будет подставлять вопрос и варианты ответа -->
          </fieldset>
          <button type="button" class="button-prev">Назад</button>
          <button type="button" class="button-next">Далее</button>
        </div>

        <div class="quiz-step" data-step="3" style="display: none">
          <h2>Шаг 3 из 3</h2>
          <fieldset>
            <legend>
              Какие компоненты вы не переносите (если такие есть)?
            </legend>
            <label><input type="checkbox" value="paraben" /> Парабены</label>
            <label><input type="checkbox" value="sulfate" /> Сульфаты</label>
            <label><input type="checkbox" value="fragrance" /> Отдушки</label>
            <label><input type="checkbox" value="alcohol" /> Спирт</label>
          </fieldset>
          <button type="button" class="button-prev">Назад</button>
          <button type="submit" class="button-next">Готово</button>
        </div>
      </form>

      <div id="quizResult" class="quiz-result"></div>
    </main>
    <footer>
      <p>© 2026 Cossel</p>
      <p>Сервис индивидуального подбора косметических средств.</p>
    </footer>
    <script src="../js/main.js" defer></script>
  </body>
</html>
